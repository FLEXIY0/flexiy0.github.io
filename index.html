<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droopi — Profile</title>
<!-- @template name="Profile Card" description="Droopi personal profile card — logo, portrait, about, contact links, social footer" -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  html, body { margin: 0; }
  .material-symbols-rounded {
    font-family: 'Material Symbols Rounded';
    font-weight: normal; font-style: normal; line-height: 1;
    letter-spacing: normal; text-transform: none; display: inline-block;
    white-space: nowrap; word-wrap: normal; direction: ltr;
    -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 10px; cursor: pointer;
    background: transparent; border: 1px solid #5C5C5C; color: #fff;
    transition: background .18s cubic-bezier(.4,0,.2,1), color .18s cubic-bezier(.4,0,.2,1), border-color .18s cubic-bezier(.4,0,.2,1);
  }
  .icon-btn:hover { background: #fff; color: #000; border-color: #fff; }
</style>
</head>
<body>
<div style="min-height:100vh;background:#000;display:flex;justify-content:center;padding:48px 24px;box-sizing:border-box;font-family:'JetBrains Mono',ui-monospace,monospace;">
  <div style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:28px;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:14px;">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:2px solid #fff;border-radius:10px;">
          <img src="assets/logo-eye-white-bold.svg" alt="Droopi" style="width:40px;height:40px;display:block;" />
        </span>
        <span style="font-size:30px;font-weight:500;letter-spacing:-0.02em;color:#fff;">Droopi</span>
      </div>
      <button class="icon-btn" type="button" aria-label="Share link" title="Share link">
        <span class="material-symbols-rounded" style="font-size:22px;">ios_share</span>
      </button>
    </div>

    <div style="height:1px;background:#2A2A2A;"></div>

    <!-- Identity -->
    <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">
      <div style="flex:1 1 160px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;">
        <h1 style="margin:0;font-size:40px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;color:#fff;">Alex<br>Oldman</h1>
        <span style="font-size:16px;color:#7A7A7A;letter-spacing:0.04em;">Technical Specialist</span>
      </div>
      <img src="assets/portrait.png" alt="Alex Oldman" style="width:230px;height:270px;object-fit:cover;border-radius:16px;border:1px solid #1C1C1C;" />
    </div>

    <div style="height:1px;background:#2A2A2A;"></div>

    <!-- About -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <h2 style="margin:0;font-size:18px;font-weight:500;color:#fff;">About me</h2>
      <p style="margin:0;font-size:15px;color:#9A9A9A;line-height:1.7;">Специалист технической поддержки и системный администратор. В свободное время делаю для себя open source‑софт — иногда им начинают пользоваться и другие.</p>
    </div>

    <div style="height:1px;background:#2A2A2A;"></div>

    <!-- Contact links -->
    <div style="display:flex;flex-direction:column;gap:16px;">
      <a href="mailto:hello@droopi.com" style="display:inline-flex;align-items:center;gap:14px;color:#9A9A9A;font-size:16px;text-decoration:none;">
        <span class="material-symbols-rounded" style="font-size:22px;color:#7A7A7A;">mail</span>hello@droopi.com
      </a>
      <a href="#" style="display:inline-flex;align-items:center;gap:14px;color:#9A9A9A;font-size:16px;text-decoration:none;">
        <span class="material-symbols-rounded" style="font-size:22px;color:#7A7A7A;">language</span>droopi.com
      </a>
      <a href="#" style="display:inline-flex;align-items:center;gap:14px;color:#9A9A9A;font-size:16px;text-decoration:none;">
        <span class="material-symbols-rounded" style="font-size:22px;color:#7A7A7A;">code</span>github.com/droopi
      </a>
    </div>

    <div style="height:1px;background:#2A2A2A;"></div>

    <!-- Footer -->
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:12px;color:#7A7A7A;">© 2026 Droopi</span>
    </div>

  </div>
</div>
</body>
</html>
